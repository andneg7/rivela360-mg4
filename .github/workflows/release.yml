name: Release automatiche
# A ogni modifica di releases/update.json allinea le release di GitHub:
# crea quelle mancanti (APK + note), la versione «stabile» è la Latest, le altre sono pre-release.
# Non serve mettere etichette a mano.
on:
  push:
    branches: [main]
    paths: ['releases/update.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlla update.json
        run: python3 .github/scripts/check_update.py .
      - name: Allinea le release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/sync_releases.py
